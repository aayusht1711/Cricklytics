version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cricklytics_db
    restart: always
    environment:
      POSTGRES_USER: cricklytics_user
      POSTGRES_PASSWORD: cricklytics_password
      POSTGRES_DB: cricklytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: cricklytics_backend
    restart: always
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://cricklytics_user:cricklytics_password@db:5432/cricklytics
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: cricklytics_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8001
    depends_on:
      - backend

volumes:
  postgres_data:
